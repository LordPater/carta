<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root { --fondo:#DCD9CF; --tinta:#23231E; --suave:#63625A; --ambar:#9C7009; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --fondo:#17170F; --tinta:#E9E5D8; --suave:#9B9887; --ambar:#DCA92E; }
  }
  :root[data-theme="dark"] { --fondo:#17170F; --tinta:#E9E5D8; --suave:#9B9887; --ambar:#DCA92E; }

  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: var(--fondo); color: var(--tinta);
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    line-height: 1.55; padding: 30px 22px;
  }
  .caja { max-width: 26rem; text-align: center; }
  h1 {
    margin: 0 0 12px; font-size: clamp(24px, 6vw, 34px);
    font-family: "Arial Black", "Segoe UI Black", sans-serif;
    text-transform: uppercase; letter-spacing: -.01em;
  }
  p { margin: 0 0 26px; color: var(--suave); }
  .ir { display: flex; flex-direction: column; gap: 12px; }
  .ir a {
    display: block; text-decoration: none; color: var(--tinta);
    border: 2px solid var(--tinta); padding: 13px 20px;
    font-size: 14px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700;
  }
  .ir a:hover { background: var(--tinta); color: var(--fondo); }
  .ir a:focus-visible { outline: 3px solid var(--ambar); outline-offset: 3px; }
</style>
</head>
<body>
  <div class="caja">
    <h1>Esta página no existe</h1>
    <p>Puede que la dirección esté mal escrita.</p>
    <div class="ir">
      <a href="/">Ver la carta</a>
      <a href="/qr/">Códigos QR</a>
    </div>
  </div>
</body>
</html>
